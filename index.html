<!doctype html>
<html lang="hr" class="app-dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Porton</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="assets/app/icons.css?v=2" />
    <link rel="stylesheet" href="assets/app/pictures.css?v=8" />
    <link rel="stylesheet" href="styles.css?v=140" />
</head>
<body>
    <!-- HERO: the camp photo, the top bar, the headline, and today's numbers as a glass strip along the bottom -->
    <header class="photo hero-wrap">
        <!-- The headline and the chart in one row, tops level: the row is centred in the photo, so they stay level on any screen height -->
        <div class="hero-row">
            <div class="hero-cols">
            <div class="hero">
                <h1 class="h1 rise">
                    <span class="h1-line" data-i18n="HERO.TITLE"></span>
                    <span class="h1-line" data-i18n="HERO.TITLE_ACCENT"></span>
                    <span class="h1-rule" aria-hidden="true"></span>
                </h1>
                <p class="lead rise" data-i18n="HERO.TEXT"></p>
                <div class="actions rise">
                    <a class="btn btn-lime btn-lg" data-app-link="/create-camp/account" data-i18n="HERO.CTA_PRIMARY"></a>
                </div>
            </div>
            </div>
        </div>

        <div class="strip rise" role="list">
            <div class="strip-item">
                <svg class="strip-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v4M10 16h4"/></svg>
                <div class="strip-name" data-i18n="NAV.RESERVATIONS"></div>
            </div>
            <div class="strip-item">
                <svg class="strip-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
                <div class="strip-name" data-i18n="NAV.ARRIVALS"></div>
            </div>
            <div class="strip-item">
                <svg class="strip-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                <div class="strip-name" data-i18n="FEATURE.F2.TITLE"></div>
            </div>
            <div class="strip-item">
                <svg class="strip-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                <div class="strip-name" data-i18n="FEATURE.F4.TITLE"></div>
            </div>
            <div class="strip-item">
                <svg class="strip-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
                <div class="strip-name" data-i18n="NAV.STATISTICS"></div>
            </div>
        </div>
    </header>

    <main>
        <!-- After the hero: a light section. Headline left, two short texts right, then four numbers underlined in lime. -->
        <section class="intro">
            <div class="wrap">
                <div class="intro-top">
                    <h2 class="intro-title" data-i18n="INTRO.TITLE"></h2>
                    <div class="intro-texts">
                        <div class="intro-text">
                            <h3 data-i18n="FEATURE.F2.TITLE"></h3>
                            <p data-i18n="FEATURE.F2.TEXT"></p>
                        </div>
                        <div class="intro-text">
                            <h3 data-i18n="NAV.TEAMS"></h3>
                            <p data-i18n="SHOW.TEAMS.TEXT"></p>
                        </div>
                    </div>
                </div>

                <div class="intro-numbers">
                    <div class="intro-number"><span class="intro-figure">6</span><span class="intro-label" data-i18n="INTRO.TASK_TYPES"></span><span class="intro-info" data-i18n="INTRO.TASK_TYPES_INFO"></span></div>
                    <div class="intro-number"><span class="intro-figure">3</span><span class="intro-label" data-i18n="INTRO.TRIAL"></span><span class="intro-info" data-i18n="INTRO.TRIAL_INFO"></span></div>
                    <div class="intro-number"><span class="intro-figure">2</span><span class="intro-label" data-i18n="INTRO.LANGUAGES"></span><span class="intro-info" data-i18n="INTRO.LANGUAGES_INFO"></span></div>
                    <div class="intro-number"><span class="intro-figure">2</span><span class="intro-label" data-i18n="INTRO.PLANS"></span><span class="intro-info" data-i18n="INTRO.PLANS_INFO"></span></div>
                </div>
            </div>
        </section>

        <!-- One section per page: a centred title and line, then the app's own page in a soft frame -->
        <!-- Home: the small cards with today's numbers and all the houses -->
                <section id="features" class="page-section page-first page-strokes">
            <div class="strokes" aria-hidden="true"><span style="top:44px;left:-8%;width:46%;height:4px;transform:rotate(-1.5deg);background:rgba(195,248,50,0.3)"></span><span style="top:70px;left:-4%;width:28%;height:3px;transform:rotate(-1deg);background:rgba(195,248,50,0.2)"></span><span style="top:250px;right:-8%;width:38%;height:4px;transform:rotate(2deg);background:rgba(195,248,50,0.26)"></span><span style="bottom:96px;right:-6%;width:56%;height:4px;transform:rotate(-1.5deg);background:rgba(195,248,50,0.3)"></span><span style="bottom:68px;right:12%;width:36%;height:3px;transform:rotate(-1deg);background:rgba(195,248,50,0.2)"></span></div>
            <div class="wrap page-text">
                <h3 data-i18n="NAV.HOME" data-mark-en="1" data-mark-hr="1" data-mark-full></h3>
                <p data-i18n="SHOW.HOME.TEXT"></p>
            </div>
            <div class="wrap wrap-wide"><div class="shot" data-pic="home" data-zoom="1.6" data-w="800" data-h="2400" data-w-sm="430" data-h-sm="1100"></div></div>
        </section>

<section class="page-section page-strokes">
            <div class="strokes" aria-hidden="true"><span style="top:44px;right:-8%;width:62%;height:4px;transform:rotate(-3deg);background:rgba(195,248,50,0.3)"></span><span style="top:64px;right:-4%;width:40%;height:3px;transform:rotate(-1.5deg);background:rgba(195,248,50,0.2)"></span><span style="top:230px;left:-8%;width:36%;height:4px;transform:rotate(2.5deg);background:rgba(195,248,50,0.28)"></span><span style="top:620px;right:-8%;width:22%;height:3px;transform:rotate(-2deg);background:rgba(195,248,50,0.2)"></span><span style="bottom:90px;left:-6%;width:66%;height:4px;transform:rotate(-2deg);background:rgba(195,248,50,0.3)"></span><span style="bottom:66px;left:4%;width:36%;height:3px;transform:rotate(-3deg);background:rgba(195,248,50,0.2)"></span></div>
            <div class="wrap page-text">
                <h3 data-i18n="NAV.RESERVATIONS" data-mark-en="1" data-mark-hr="1" data-mark-full></h3>
                <p data-i18n="SHOW.RESERVATIONS.TEXT"></p>
            </div>
            <div class="wrap wrap-wide"><div class="shot" data-pic="res" data-anim="res" data-w="1000" data-h="1600" data-w-sm="520" data-h-sm="1100" aria-hidden="true"></div></div>
        </section>

        <section class="page-section page-light">
            <div class="wrap page-text">
                <h3 data-i18n="SHOW.DAILY.TITLE" data-mark-en="3" data-mark-hr="2"></h3>
                <p data-i18n="SHOW.DAILY.TEXT"></p>
            </div>
            <div class="wrap wrap-wide wrap-steps">
                <!-- The Daily Sheet on a laptop, and the team's page on a phone laid over its corner: teams are made here, and this is what the worker sees -->
                <div class="steps">
                    <div class="step"><div class="step-head"><span class="step-n">1</span><span data-i18n="STEPS.ONE"></span></div><div class="step-card"><div class="shot" data-pic="automation" data-zoom="1.1" data-w="380" data-h="1100"></div></div></div>
                    <div class="step"><div class="step-head"><span class="step-n">2</span><span data-i18n="STEPS.TWO"></span></div>
                    <div class="duo">
                    <div class="monitor">
                        <div class="monitor-screen"><div class="shot" data-pic="daily" data-w="800" data-h="700" aria-hidden="true"></div></div>
                        <div class="monitor-base"></div>
                    </div>
                    <div class="phone">
                        <div class="phone-screen"><div class="shot shot-team" data-pic="team" data-w="390" data-h="900" aria-hidden="true"></div></div>
                    </div>
                </div>
                    </div>
                </div>
            </div>
        </section>

                <section class="page-section page-strokes">
            <div class="strokes" aria-hidden="true"><span style="top:60px;left:-8%;width:58%;height:4px;transform:rotate(2.5deg);background:rgba(195,248,50,0.3)"></span><span style="top:80px;left:-4%;width:36%;height:3px;transform:rotate(1.5deg);background:rgba(195,248,50,0.2)"></span><span style="top:170px;right:-8%;width:44%;height:4px;transform:rotate(-2deg);background:rgba(195,248,50,0.28)"></span><span style="top:700px;left:-8%;width:20%;height:3px;transform:rotate(-2.5deg);background:rgba(195,248,50,0.2)"></span><span style="bottom:100px;right:-6%;width:62%;height:4px;transform:rotate(2deg);background:rgba(195,248,50,0.3)"></span><span style="bottom:76px;right:6%;width:34%;height:3px;transform:rotate(3deg);background:rgba(195,248,50,0.2)"></span></div>
            <div class="wrap page-text">
                <h3 data-i18n="NAV.STATISTICS" data-mark-en="1" data-mark-hr="1" data-mark-full></h3>
                <p data-i18n="SHOW.STATISTICS.TEXT"></p>
            </div>
            <div class="wrap wrap-wide"><div class="shot" data-pic="stats" data-w="1000" data-h="1700" data-w-sm="460" data-h-sm="1100"></div></div>
        </section>

        <!-- Tasks, Notifications, More camps, User guide: one pale band, three columns split by thin lines -->
        <section class="more">
            <div class="more-row">
                <div class="more-item">
                    <svg class="more-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                    <h3 class="more-title" data-i18n="FEATURE.F2.TITLE"></h3>
                    <p data-i18n="FEATURE.F2.TEXT"></p>
                </div>
                <div class="more-item">
                    <svg class="more-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                    <h3 class="more-title" data-i18n="FEATURE.F4.TITLE"></h3>
                    <p data-i18n="FEATURE.F4.TEXT"></p>
                </div>
                <div class="more-item">
                    <svg class="more-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z"/></svg>
                    <h3 class="more-title" data-i18n="FEATURE.F6.TITLE"></h3>
                    <p data-i18n="FEATURE.F6.TEXT"></p>
                </div>
                <div class="more-item">
                    <svg class="more-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                    <h3 class="more-title" data-i18n="FEATURE.F7.TITLE"></h3>
                    <p data-i18n="FEATURE.F7.TEXT"></p>
                </div>
            </div>
        </section>

        <!-- Call to action, on the photo again -->
        <section id="start" class="wrap cta-wrap">
            <div class="cta">
                <div class="cta-inner">
                    <h2 class="cta-title" data-i18n="CTA.TITLE"></h2>
                    <p class="cta-text" data-i18n="CTA.TEXT"></p>
                    <p class="plans-note" data-i18n="PLANS.TRIAL"></p>
                    <!-- The two plans, with what each one opens (the same pages the app's plan screen lists) -->
                    <div class="plans">
                        <article class="plan">
                            <h4 class="plan-name" data-i18n="PLANS.STANDARD"></h4>
                            <p class="plan-price" data-i18n="PLANS.PRICE_STANDARD"></p>
                            <ul class="plan-list">
                                <li data-i18n="PLANS.HOME"></li>
                                <li data-i18n="NAV.RESERVATIONS"></li>
                                <li data-i18n="NAV.TEAMS"></li>
                                <li data-i18n="NAV.DAILY"></li>
                                <li data-i18n="NAV.ARRIVALS"></li>
                                <li data-i18n="PLANS.CONTENT"></li>
                                <li data-i18n="PLANS.GUIDE"></li>
                            </ul>
                            <a class="btn btn-ghost btn-lg" data-app-link="/create-camp/account" data-i18n="CTA.PRIMARY"></a>
                        </article>
                        <article class="plan plan-premium">
                            <h4 class="plan-name" data-i18n="PLANS.PREMIUM"></h4>
                            <p class="plan-price" data-i18n="PLANS.PRICE_PREMIUM"></p>
                            <p class="plan-plus" data-i18n="PLANS.PLUS"></p>
                            <ul class="plan-list">
                                <li data-i18n="PLANS.NOTES"></li>
                                <li data-i18n="PLANS.SCHEDULE"></li>
                                <li data-i18n="NAV.STATISTICS"></li>
                                <li data-i18n="PLANS.ARCHIVE"></li>
                            </ul>
                            <a class="btn btn-lime btn-lg" data-app-link="/create-camp/account" data-i18n="CTA.PRIMARY"></a>
                        </article>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="wrap footer-row">
            <div class="footer-brand"><img src="assets/logo-lime.svg" alt="Porton" class="logo-sm" /><span data-i18n="FOOTER.BLURB"></span></div>
            <div class="footer-links">
                <a href="#features" data-i18n="FOOTER.LINK_FEATURES"></a>
                <a data-app-link="/help" data-i18n="FOOTER.LINK_GUIDE"></a>
                <a data-app-link="/login" data-i18n="FOOTER.LINK_LOGIN"></a>
                <a data-app-link="/create-camp/account" data-i18n="FOOTER.LINK_SIGNUP"></a>
                <a data-app-link="/privacy-policy" data-i18n="FOOTER.LINK_PRIVACY"></a>
                <span data-i18n="FOOTER.COPYRIGHT"></span>
            </div>
        </div>
    </footer>

    <script src="assets/app/pictures.js?v=16"></script>
    <script src="assets/stats-demo.js?v=8"></script>
    <script src="script.js?v=52"></script>
</body>
</html>
